<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <script>try{const saved=localStorage.getItem("site-theme");document.documentElement.dataset.theme=saved==="light"||saved==="dark"?saved:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch{document.documentElement.dataset.theme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}</script>
  <link rel="preload" href="/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  {{HEAD_EXTRA}}
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/main.js"></script>
</head>
<body class="page-{{PAGE_KIND}}">
  <header class="site-header">
    <div class="site-location" title="{{FULL_PATH}}">{{PARENT_LINK}}{{HEADER_PATH}}</div>
    <nav class="site-nav" aria-label="Primary navigation">
      <a {{NAV_NOTES_ATTR}} href="/notes/">Notes</a>
      <a {{NAV_TAGS_ATTR}} href="/tags/">Tags</a>
      <a {{NAV_ABOUT_ATTR}} href="/about/">About</a>
      <span class="site-nav-tools">
        <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2m0 15v2M4.6 4.6 6 6m12 12 1.4 1.4M2.5 12h2m15 0h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        </button>
        <button class="icon-button terminal-toggle" id="terminal-toggle" type="button" aria-label="Open terminal" title="Open terminal (&#96;)" aria-controls="terminal" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 7 5 5-5 5m8 0h6"/></svg>
        </button>
      </span>
    </nav>
  </header>
  <main data-directory="{{DIRECTORY_PATH}}">{{CONTENT}}</main>
  <footer class="site-footer">{{FOOTER}}</footer>
  <section class="terminal" id="terminal" aria-label="Site terminal" hidden>
    <button class="terminal-resize" id="terminal-resize" type="button" aria-label="Resize terminal" title="Drag to resize · arrow keys adjust height"></button>
    <div class="terminal-heading">
      <span id="terminal-title">nomad / terminal</span>
      <button class="terminal-close" id="terminal-close" type="button" aria-label="Close terminal">×</button>
    </div>
    <div class="terminal-output" id="terminal-output" aria-live="polite"></div>
    <form id="terminal-form" autocomplete="off">
      <label class="terminal-prompt" for="terminal-input"><span class="prompt-user">nomad@home</span><span class="prompt-path" id="terminal-cwd">~</span></label>
      <span class="terminal-field">
        <span class="terminal-mirror" id="terminal-mirror" aria-hidden="true"></span>
        <input id="terminal-input" name="command" aria-label="Digital garden command" autocapitalize="none" autocomplete="off" spellcheck="false">
      </span>
      <span class="terminal-rprompt" id="terminal-rprompt" aria-hidden="true"></span>
    </form>
    <p class="terminal-help">help for commands · Tab completes · → accepts a suggestion · Esc closes</p>
  </section>
</body>
</html>
